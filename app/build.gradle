plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hypeai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hypeai.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ── ABI targets ────────────────────────────────────────────────────
        // arm64-v8a   = 64-bit ARM (modern phones, primary)
        // armeabi-v7a = 32-bit ARM (older/low-end devices, fallback)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ── Per-ABI split APKs ──────────────────────────────────────────────────
    // Produces:
    //   app-arm64-v8a-debug.apk      ← 64-bit (use this for most phones)
    //   app-armeabi-v7a-debug.apk    ← 32-bit fallback
    //   app-universal-debug.apk      ← fat APK with both ABIs
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // ── Packaging options ──────────────────────────────────────────────────
    packaging {
        jniLibs {
            // Required so Vosk native .so libs are extracted to disk at install
            // time (needed for the Vosk JNI bridge to find them at runtime).
            useLegacyPackaging true
        }
        resources {
            // Exclude duplicate license/meta files that cause merge conflicts
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/DEPENDENCIES',
            ]
        }
    }

    // Suppress lint error for missing translations (single-language app)
    lint {
        disable 'MissingTranslation'
        abortOnError false
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'

    // ── Vosk — offline speech recognition ───────────────────────────────────
    // Provides: org.vosk.Model, org.vosk.Recognizer,
    //           org.vosk.android.SpeechService, org.vosk.android.StorageService
    // Repository: https://alphacephei.com/maven/  (added in settings.gradle)
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    }
}
