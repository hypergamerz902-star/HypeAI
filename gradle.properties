# ── JVM heap ────────────────────────────────────────────────────────────────
# Termux tip: lower to -Xmx1536m if you hit OOM on a low-RAM device
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ── AndroidX ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── Performance ───────────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ── Suppress "This project uses deprecated Gradle features" warnings ─────────
android.suppressUnsupportedCompileSdk=35

# ── Lint / compile ────────────────────────────────────────────────────────────
# Disable pre-dex for Termux builds to save memory
# android.enableD8.desugaring=true is on by default in AGP 8.x
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
