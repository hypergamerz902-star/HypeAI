pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // ── Vosk offline speech recognition library ──────────────────────────
        // Required for com.alphacephei:vosk-android — NOT on Maven Central
        maven { url 'https://alphacephei.com/maven/' }
    }
}

rootProject.name = "HypeAI"
include ':app'
